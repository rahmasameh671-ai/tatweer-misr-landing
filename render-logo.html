<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
  const canvas = document.getElementById('c');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const idata = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = idata.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const br = 0.299 * r + 0.587 * g + 0.114 * b;
    // Check if black
    if (br < 40 && !(r > 120 && r > g + 40)) {
      d[i+3] = 0; // transparent!
    } else if (r > 120 && r > g + 40) {
      // keep red/orange dot
      d[i+3] = 255;
    } else {
      // make white text dark charcoal #141821
      const alpha = Math.min(255, br * 1.3);
      d[i] = 20;
      d[i+1] = 24;
      d[i+2] = 33;
      d[i+3] = alpha;
    }
  }
  ctx.putImageData(idata, 0, 0);
  const dataUrl = canvas.toDataURL('image/png');
  fetch('http://localhost:8088/save-logo', {
    method: 'POST',
    body: dataUrl
  });
};
img.src = 'assets/logos/tatweer-misr-logo.webp';
</script>
</body>
</html>
